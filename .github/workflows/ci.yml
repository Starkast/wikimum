name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  schedule:
    - cron:  "0 6 * * 6" # 06:00 every Saturday
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy from main, even if the tests fail. Empty only runs the tests

jobs:
  docker:
    if: |
      github.head_ref == 'main' ||
      (github.event.action == 'labeled' && github.event.label.name == 'docker-test')
    runs-on: ubuntu-latest
    needs: ruby
    steps:
      - uses: actions/checkout@v7
      - run: ./bin/docker-test
  ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_LOCAL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dentarg/postgres@v1
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake
        env:
          TEST_DATABASE_URL: "${{ env.POSTGRES_URL }}"
  browser:
    runs-on: ubuntu-latest
    env:
      BUNDLE_LOCAL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dentarg/postgres@v1
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --ignore-scripts
      - run: npm list --all
      - run: bundle exec rake test:browser
        env:
          TEST_DATABASE_URL: "${{ env.POSTGRES_URL }}"
  deploy:
    needs:
      - ruby
      - browser
    # Pushes to main once the tests pass. By hand from main it doesn't depend on
    # them, a rollback may be what fixes them. The environment only gives main the
    # keys, a pull request can change this file but not that.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' &&
        needs.ruby.result == 'success' &&
        needs.browser.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.ref != ''))
    concurrency: biff-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and variables from Starkast/ansible's bin/github-deploy-keys
    environment: biff
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # biff only lets this peer SSH to the VM
      - name: Connect to Biff over WireGuard
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --quiet --yes --no-install-recommends wireguard-tools
          umask 077
          printf '%s\n' \
            '[Interface]' \
            "PrivateKey = $WIREGUARD_PRIVATE_KEY" \
            "Address = $WIREGUARD_ADDRESS/32" \
            '[Peer]' \
            "PublicKey = $WIREGUARD_PEER_PUBLIC_KEY" \
            "Endpoint = $WIREGUARD_ENDPOINT" \
            "AllowedIPs = $DEPLOY_HOST/32" \
            'PersistentKeepalive = 25' > "$RUNNER_TEMP/wg0.conf"
          # AppArmor only lets wg-quick read its configs in /etc/wireguard
          sudo install -m 600 "$RUNNER_TEMP/wg0.conf" /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WIREGUARD_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      # The key's forced command reads `deploy <sha>` and the release on stdin
      - name: Deploy
        run: |
          set -o pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          git archive --format=tar.gz --prefix=wikimum/ HEAD |
            ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy "$(git rev-parse HEAD)"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
