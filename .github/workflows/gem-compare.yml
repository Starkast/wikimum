name: Gem Compare

on:
  pull_request:
    types:
      - labeled
      - ready_for_review
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    # A fork's branch can have any name, and pull_request_target gives it this
    # job's write token
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'dependabot/bundler/') ||
       startsWith(github.head_ref, 'bump-') ||
       (github.event.action == 'labeled' && github.event.label.name == 'gem-compare'))
    runs-on: ubuntu-slim
    steps:
      - uses: dentarg/gem-compare@7151807d222f653c3abc4137edde2eca27b1b009 # v1.4.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
