name: Deploy to Biff

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy
        default: main

jobs:
  deploy:
    # Only pushes to this repo's main, a fork's pull request can come from a
    # branch named main too
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    concurrency: biff-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and variables from Starkast/ansible's bin/github-deploy-keys
    environment: biff
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      # biff only lets this peer SSH to the VM
      - name: Connect to Biff over WireGuard
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --quiet --yes --no-install-recommends wireguard-tools
          umask 077
          printf '%s\n' \
            '[Interface]' \
            "PrivateKey = $WIREGUARD_PRIVATE_KEY" \
            "Address = $WIREGUARD_ADDRESS/32" \
            '[Peer]' \
            "PublicKey = $WIREGUARD_PEER_PUBLIC_KEY" \
            "Endpoint = $WIREGUARD_ENDPOINT" \
            "AllowedIPs = $DEPLOY_HOST/32" \
            'PersistentKeepalive = 25' > "$RUNNER_TEMP/wg0.conf"
          # AppArmor only lets wg-quick read its configs in /etc/wireguard
          sudo install -m 600 "$RUNNER_TEMP/wg0.conf" /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          WIREGUARD_ADDRESS: ${{ vars.WIREGUARD_ADDRESS }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ vars.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ vars.WIREGUARD_ENDPOINT }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      # The key's forced command reads `deploy <sha>` and the release on stdin
      - name: Deploy
        run: |
          set -o pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          git archive --format=tar.gz --prefix=wikimum/ HEAD |
            ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy "$(git rev-parse HEAD)"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
